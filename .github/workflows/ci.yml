name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node bin/flow.mjs selftest
      - name: Install the packed tarball and run it
        shell: bash
        run: |
          npm install -g "./$(npm pack --silent)"
          test "$(flow --version)" = "$(node -p "require('./package.json').version")"
      - name: Check package metadata
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npx --yes publint@0.3.25 --strict

  release-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: node .github/scripts/check-npm-version.mjs
      - run: npm ci --ignore-scripts
      - run: npm test
